name: CI

on:
  push:
    branches: [ main ]
  pull_request:

permissions:
  contents: read

jobs:
  format:
    if: ${{ github.event_name == 'push' || github.event_name == 'pull_request' }}
    runs-on: ubuntu-22.04
    steps:
      - name: Checkout PR
        if: ${{ github.event_name == 'pull_request' }} 
        uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.sha }}
      - name: Checkout
        if: ${{ github.event_name == 'push' }}
        uses: actions/checkout@v4
      
      - name: Install tools
        run: |
          sudo apt update && sudo apt install clang-format-13
      
      - name: Check formatting
        run: |
          make check_format

  asm-triage-tests:
    runs-on: ubuntu-22.04
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - name: Run local, ROM-free Python tests
        run: python3 -m unittest discover -s scripts/tests -v

  build:
    # Do not fetch private ROMs or use secrets for untrusted pull requests.
    # Fork owners can enable the ROM-backed build after configuring secrets.
    if: ${{ github.event_name == 'push' && vars.ENABLE_ROM_BUILD == 'true' }}
    runs-on: ubuntu-22.04
    steps:
      - name: Checkout PR
        if: ${{ github.event_name == 'pull_request' }} 
        uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.sha }}

      - name: Checkout
        if: ${{ github.event_name == 'push' }}
        uses: actions/checkout@v4

      - name: Checkout agbcc
        uses: actions/checkout@v4
        with:
          path: agbcc
          repository: SAT-R/agbcc

      - name: Install tools
        run: |
          sudo apt update && sudo apt install gcc-arm-none-eabi binutils-arm-none-eabi xorg-dev
          python3 -m pip install gitpython
        # build-essential, git, and libpng-dev are already installed
        # gcc-arm-none-eabi is only needed for the modern build
        # as an alternative to dkP

      - name: Install agbcc
        run: |
          ./build.sh
          ./install.sh ../
        working-directory: agbcc
        
      - name: Fetch private baserom (trusted push only)
        env:
          STORAGE_URL: ${{ secrets.STORAGE_URL }}
          STORAGE_USERNAME: ${{ secrets.STORAGE_USERNAME }}
          STORAGE_PASSWORD: ${{ secrets.STORAGE_PASSWORD }}
        run: |
          test -n "$STORAGE_URL" && test -n "$STORAGE_USERNAME" && test -n "$STORAGE_PASSWORD"
          curl --fail --show-error --silent --location \
            --user "$STORAGE_USERNAME:$STORAGE_PASSWORD" \
            --output baserom_sa3.gba "$STORAGE_URL/baserom.gba"
          sha1sum -c sa3.sha1

      - name: Compare
        run: make -j"$(nproc)" compare

      - name: Progress
        run: |
          python3 scripts/progress.py text

      - name: Generate reports
        run: |
          mkdir -p gh-pages/reports
          mkdir -p gh-pages/maps
          python3 scripts/progress.py csv >> gh-pages/reports/progress-sa3-nonmatching.csv
          python3 scripts/progress.py csv -m >> gh-pages/reports/progress-sa3-matching.csv
          python3 scripts/progress.py shield-json > gh-pages/reports/progress-sa3-shield.json
          echo "REPORTS_COMMIT_MSG=$( git log --format=%s ${GITHUB_SHA} )" >> $GITHUB_ENV
          cp sa3.map gh-pages/maps/${GITHUB_SHA}.map
          
      - name: Upload progress
        if: ${{ github.event_name == 'push' || github.event_name == 'pull_request' }}
        uses: actions/upload-artifact@v7
        with:
          path: |
            gh-pages

  publish-progress:
    name: Publish progress
    runs-on: ubuntu-24.04
    needs: [build]
    # Only able to run from repo pull requests (by maintainers, for debugging)
    # or on the main branch via push
    if: ${{ github.event_name == 'push' && vars.ENABLE_ROM_BUILD == 'true' }}
    permissions:
      contents: write
    steps:
      - name: Checkout gh-pages
        uses: actions/checkout@v4
        with:
          path: gh-pages
          ref: gh-pages
      - name: Download progress
        uses: actions/download-artifact@v7
        with:
          path: |
            gh-pages
      - run: |
          cd gh-pages
          git status
      - name: Publish reports
        if: ${{ github.event_name == 'push' }}
        uses: EndBug/add-and-commit@v7
        with:
          branch: gh-pages
          cwd: "./gh-pages"
          add: "reports maps"
          message: ${{ env.REPORTS_COMMIT_MSG }}
